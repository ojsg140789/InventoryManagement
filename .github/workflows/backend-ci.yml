name: Backend CI
on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore InventoryManagement.slnx
      - run: dotnet build InventoryManagement.slnx --configuration Release --no-restore
      - run: dotnet test InventoryManagement.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
